openapi: 3.2.0
info:
  title: ImageKit API
  version: 1.0.0
  description: Checkout API overview to learn about ImageKit's APIs, authentication, rate limits, and error codes etc.
  contact:
    email: developer@imagekit.io
    name: ImageKit Team
    url: https://imagekit.io
  termsOfService: https://imagekit.io/terms/
servers:
- url: https://api.imagekit.io
security:
- basicAuth: []
tags:
- name: ImageKit API
paths: {}
webhooks:
  video.transformation.accepted:
    post:
      operationId: video-transformation-accepted
      summary: Video transformation accepted
      description: Triggered when a new video transformation request is accepted for processing. This event is primarily useful for debugging purposes and tracking the start of video transformations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoTransformationAcceptedEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  video.transformation.ready:
    post:
      operationId: video-transformation-ready
      summary: Video transformation ready
      description: Triggered when video encoding is finished and the transformed resource is ready to be served. Listen to this webhook and update any flags in your database or CMS so your application can start displaying the transformed video to users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoTransformationReadyEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  video.transformation.error:
    post:
      operationId: video-transformation-error
      summary: Video transformation error
      description: Triggered when a video transformation fails during processing. Listen to this webhook to log the error reason and take appropriate action. Check your origin and URL endpoint settings if the reason is related to download failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoTransformationErrorEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  upload.pre-transform.success:
    post:
      operationId: upload-pre-transform-success
      summary: Pre-transformation success
      description: Triggered when a pre-transformation completes successfully. Pre-transformations are applied before the file is uploaded to the Media Library, allowing you to optimize files at ingestion time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPreTransformSuccessEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  upload.pre-transform.error:
    post:
      operationId: upload-pre-transform-error
      summary: Pre-transformation error
      description: Triggered when a pre-transformation fails. The original file upload may have been accepted, but the requested transformation could not be applied. Review the error reason to understand what went wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPreTransformErrorEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  upload.post-transform.success:
    post:
      operationId: upload-post-transform-success
      summary: Post-transformation success
      description: Triggered when a post-transformation completes successfully. Post-transformations are applied after the file has been uploaded to the Media Library, generating transformed versions that are ready for immediate delivery. Each post-transformation generates a separate webhook event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPostTransformSuccessEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  upload.post-transform.error:
    post:
      operationId: upload-post-transform-error
      summary: Post-transformation error
      description: Triggered when a post-transformation fails. The original file remains available in the Media Library, but the requested transformation could not be generated. Review the error reason to determine the cause of failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadPostTransformErrorEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  file.created:
    post:
      operationId: file-created
      summary: File created
      description: Triggered when a file is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileCreateEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  file.updated:
    post:
      operationId: file-updated
      summary: File updated
      description: Triggered when a file is updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUpdateEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  file.deleted:
    post:
      operationId: file-deleted
      summary: File deleted
      description: Triggered when a file is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDeleteEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  file-version.created:
    post:
      operationId: file-version-created
      summary: File version created
      description: Triggered when a file version is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileVersionCreateEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
  file-version.deleted:
    post:
      operationId: file-version-deleted
      summary: File version deleted
      description: Triggered when a file version is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileVersionDeleteEvent'
      responses:
        '200':
          description: Acknowledge
      tags:
      - ImageKit API
components:
  schemas:
    VersionInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the file version.
        name:
          type: string
          description: Name of the file version.
      description: 'An object containing the file or file version''s `id` (versionId) and `name`.

        '
    UploadPostTransformSuccessEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a post-transformation completes successfully. The transformed version of the file is now ready and can be accessed via the provided URL. Note that each post-transformation generates a separate webhook event.

          '
        properties:
          type:
            type: string
            const: upload.post-transform.success
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          request:
            $ref: '#/components/schemas/PostTransformWebhookRequestInfo'
          data:
            type: object
            properties:
              fileId:
                type: string
                description: Unique identifier of the originally uploaded file.
              url:
                type: string
                format: uri
                description: URL of the generated post-transformation.
              name:
                type: string
                description: Name of the file.
            required:
            - fileId
            - url
            - name
        required:
        - type
        - created_at
        - request
        - data
    FileVersionCreateEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a file version is created.

          '
        properties:
          type:
            type: string
            const: file-version.created
            description: Type of the webhook event.
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          data:
            $ref: '#/components/schemas/FileDetails'
        required:
        - type
        - created_at
        - data
    VideoTransformationReadyEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when video encoding is finished and the transformed resource is ready to be served. This is the key event to listen for - update your database or CMS flags when you receive this so your application can start showing the transformed video to users.

          '
        properties:
          type:
            type: string
            const: video.transformation.ready
          created_at:
            type: string
            format: date-time
            description: Timestamp when the event was created in ISO8601 format.
          request:
            $ref: '#/components/schemas/VideoWebhookRequestInfo'
          timings:
            type: object
            description: Performance metrics for the transformation process.
            properties:
              download_duration:
                type: integer
                description: Time spent downloading the source video from your origin or media library, in milliseconds.
              encoding_duration:
                type: integer
                description: Time spent encoding the video, in milliseconds.
          data:
            type: object
            properties:
              asset:
                $ref: '#/components/schemas/VideoAsset'
              transformation:
                allOf:
                - $ref: '#/components/schemas/VideoTransformationBase'
                - type: object
                  properties:
                    output:
                      type: object
                      description: Information about the transformed output video.
                      properties:
                        url:
                          type: string
                          format: uri
                          description: URL to access the transformed video.
                        video_metadata:
                          type: object
                          description: Metadata of the output video file.
                          properties:
                            duration:
                              type: number
                              description: Duration of the output video in seconds.
                            width:
                              type: integer
                              description: Width of the output video in pixels.
                            height:
                              type: integer
                              description: Height of the output video in pixels.
                            bitrate:
                              type: integer
                              description: Bitrate of the output video in bits per second.
                          required:
                          - duration
                          - width
                          - height
                          - bitrate
                      required:
                      - url
            required:
            - asset
            - transformation
        required:
        - type
        - created_at
        - request
        - data
    CustomMetadata:
      type: object
      description: 'A key-value data associated with the asset.

        '
      additionalProperties: true
    UploadPreTransformErrorEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a pre-transformation fails. The file upload may have been accepted, but the requested transformation could not be applied.

          '
        properties:
          type:
            type: string
            const: upload.pre-transform.error
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          request:
            $ref: '#/components/schemas/PreTransformWebhookRequestInfo'
          data:
            type: object
            properties:
              name:
                type: string
                description: Name of the file.
              path:
                type: string
                description: Path of the file.
              transformation:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      reason:
                        type: string
                        description: Reason for the pre-transformation failure.
                        example: encoding_failed
                    required:
                    - reason
                required:
                - error
            required:
            - name
            - path
            - transformation
        required:
        - type
        - created_at
        - request
        - data
    VideoTransformationErrorEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when an error occurs during video encoding. Listen to this webhook to log error reasons and debug issues. Check your origin and URL endpoint settings if the reason is related to download failure. For other errors, contact ImageKit support.

          '
        properties:
          type:
            type: string
            const: video.transformation.error
          created_at:
            type: string
            format: date-time
            description: Timestamp when the event was created in ISO8601 format.
          request:
            $ref: '#/components/schemas/VideoWebhookRequestInfo'
          data:
            type: object
            properties:
              asset:
                $ref: '#/components/schemas/VideoAsset'
              transformation:
                allOf:
                - $ref: '#/components/schemas/VideoTransformationBase'
                - type: object
                  properties:
                    error:
                      type: object
                      description: Details about the transformation error.
                      properties:
                        reason:
                          type: string
                          description: 'Specific reason for the transformation failure:

                            - `encoding_failed`: Error during video encoding process

                            - `download_failed`: Could not download source video

                            - `internal_server_error`: Unexpected server error

                            '
                          enum:
                          - encoding_failed
                          - download_failed
                          - internal_server_error
                      required:
                      - reason
            required:
            - asset
            - transformation
        required:
        - type
        - created_at
        - request
        - data
    FileDetails:
      title: File & File Version
      description: Object containing details of a file or file version.
      type: object
      properties:
        fileId:
          type: string
          description: Unique identifier of the asset.
        type:
          type: string
          description: Type of the asset.
          enum:
          - file
          - file-version
        name:
          type: string
          description: Name of the asset.
        filePath:
          type: string
          description: 'Path of the file. This is the path you would use in the URL to access the file. For example, if the file is at the root of the media library, the path will be `/file.jpg`. If the file is inside a folder named `images`, the path will be `/images/file.jpg`.

            '
        tags:
          type:
          - array
          - null
          items:
            type: string
          description: 'An array of tags assigned to the file. Tags are used to search files in the media library.

            '
        AITags:
          type:
          - array
          - null
          items:
            $ref: '#/components/schemas/AITag'
          description: 'Array of AI-generated tags associated with the image. If no AITags are set, it will be null.

            '
        versionInfo:
          description: 'An object with details of the file version.

            '
          $ref: '#/components/schemas/VersionInfo'
        isPrivateFile:
          type: boolean
          description: 'Specifies if the file is private or not.

            '
        isPublished:
          type: boolean
          description: 'Specifies if the file is published or not.

            '
        customCoordinates:
          type:
          - string
          - null
          description: 'An string with custom coordinates of the file.

            '
        url:
          type: string
          format: uri
          description: 'URL of the file.

            '
        thumbnail:
          type: string
          format: uri
          description: 'URL of the thumbnail image. This URL is used to access the thumbnail image of the file in the media library.

            '
        fileType:
          type: string
          description: 'Type of the file. Possible values are `image`, `non-image`.

            '
        mime:
          type: string
          description: 'MIME type of the file.

            '
        width:
          type: number
          description: 'Width of the file.

            '
        height:
          type: number
          description: 'Height of the file.

            '
        size:
          type: number
          description: 'Size of the file in bytes.

            '
        bitRate:
          type: integer
          description: The bit rate of the video in kbps (only for video).
        duration:
          type: integer
          description: The duration of the video in seconds (only for video).
        audioCodec:
          type: string
          description: The audio codec used in the video (only for video/audio).
        videoCodec:
          type: string
          description: The video codec used in the video (only for video).
        hasAlpha:
          type: boolean
          description: 'Specifies if the image has an alpha channel.

            '
        customMetadata:
          description: 'An object with custom metadata for the file.

            '
          $ref: '#/components/schemas/CustomMetadata'
        selectedFieldsSchema:
          $ref: '#/components/schemas/SelectedFieldsSchema'
        embeddedMetadata:
          $ref: '#/components/schemas/EmbeddedMetadata'
          description: Consolidated embedded metadata associated with the file. It includes exif, iptc, and xmp data.
        description:
          type: string
          description: 'Optional text to describe the contents of the file. Can be set by the user or the ai-auto-description extension.

            '
        createdAt:
          type: string
          format: date-time
          description: 'Date and time when the file was uploaded. The date and time is in ISO8601 format.

            '
        updatedAt:
          type: string
          format: date-time
          description: 'Date and time when the file was last updated. The date and time is in ISO8601 format.

            '
    Gps:
      description: Object containing GPS information.
      type: object
      additionalProperties: true
      properties:
        GPSVersionID:
          type: array
          items:
            type: integer
        GPSLatitudeRef:
          type: string
        GPSLatitude:
          type: array
          items:
            type: number
        GPSLongitudeRef:
          type: string
        GPSLongitude:
          type: array
          items:
            type: number
        GPSAltitudeRef:
          type: integer
        GPSAltitude:
          type: number
        GPSTimeStamp:
          type: array
          items:
            type: number
        GPSImgDirectionRef:
          type: string
        GPSImgDirection:
          type: number
        GPSDateStamp:
          type: string
    VideoTransformationAcceptedEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a new video transformation request is accepted for processing. This event confirms that ImageKit has received and queued your transformation request. Use this for debugging and tracking transformation lifecycle.

          '
        properties:
          type:
            type: string
            const: video.transformation.accepted
          created_at:
            type: string
            format: date-time
            description: Timestamp when the event was created in ISO8601 format.
          request:
            $ref: '#/components/schemas/VideoWebhookRequestInfo'
          data:
            type: object
            properties:
              asset:
                $ref: '#/components/schemas/VideoAsset'
              transformation:
                $ref: '#/components/schemas/VideoTransformationBase'
            required:
            - asset
            - transformation
        required:
        - type
        - created_at
        - request
        - data
    Thumbnail:
      description: Object containing Thumbnail information.
      type: object
      additionalProperties: true
      properties:
        Compression:
          type: integer
        XResolution:
          type: number
        YResolution:
          type: number
        ResolutionUnit:
          type: integer
        ThumbnailOffset:
          type: integer
        ThumbnailLength:
          type: integer
    VideoAsset:
      type: object
      description: Information about the source video asset being transformed.
      properties:
        url:
          type: string
          format: uri
          description: URL to download or access the source video file.
      required:
      - url
    ExifDetails:
      description: Object containing Exif details.
      x-stainless-naming:
        java:
          type_name: ExifDetails
      type: object
      additionalProperties: true
      properties:
        ExposureTime:
          type: number
        FNumber:
          type: number
        ExposureProgram:
          type: integer
        ISO:
          type: integer
        ExifVersion:
          type: string
        DateTimeOriginal:
          type: string
        CreateDate:
          type: string
        ShutterSpeedValue:
          type: number
        ApertureValue:
          type: number
        ExposureCompensation:
          type: number
        MeteringMode:
          type: integer
        Flash:
          type: integer
        BrightnessValue:
          type: number
        MaxApertureValue:
          type: number
        LightSource:
          type: integer
        FocalLength:
          type: number
        UserComment:
          type: string
        SensingMethod:
          type: integer
        SceneType:
          type: string
        FocalLengthIn35mmFormat:
          type: integer
        LensModel:
          type: string
        SubSecTime:
          type: string
        FlashpixVersion:
          type: string
        ColorSpace:
          type: integer
        ExifImageWidth:
          type: integer
        ExifImageHeight:
          type: integer
        InteropOffset:
          type: integer
        FocalPlaneXResolution:
          type: number
        FocalPlaneYResolution:
          type: number
        FocalPlaneResolutionUnit:
          type: integer
        CustomRendered:
          type: integer
        ExposureMode:
          type: integer
        WhiteBalance:
          type: integer
        SceneCaptureType:
          type: integer
    SelectedFieldsSchema:
      type: object
      description: 'This field is included in the response only if the Path policy feature is available in the plan.

        It contains schema definitions for the custom metadata fields selected for the specified file path.

        Field selection can only be done when the Path policy feature is enabled.


        Keys are the names of the custom metadata fields; the value object has details about the custom metadata schema.

        '
      additionalProperties:
        type: object
        required:
        - type
        properties:
          type:
            description: Type of the custom metadata field.
            type: string
            enum:
            - Text
            - Textarea
            - Number
            - Date
            - Boolean
            - SingleSelect
            - MultiSelect
          selectOptions:
            type: array
            items:
              oneOf:
              - type: string
              - type: number
              - type: boolean
            description: 'An array of allowed values when field type is `SingleSelect` or `MultiSelect`.

              '
            example:
            - small
            - medium
            - large
            - 30
            - 40
            - true
          selectOptionsTruncated:
            type: boolean
            description: 'Specifies if the selectOptions array is truncated. It is truncated when number of options are > 100.

              '
          defaultValue:
            description: 'The default value for this custom metadata field. The value should match the `type` of custom metadata field.

              '
            oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              x-stainless-variantName: Mixed
              title: Mixed
              items:
                oneOf:
                - type: string
                - type: number
                - type: boolean
              description: 'Default value should be of type array when custom metadata field type is set to `MultiSelect`.

                '
              example:
              - true
              - 10
              - Hello
          isValueRequired:
            type: boolean
            description: 'Specifies if the custom metadata field is required or not.

              '
          readOnly:
            type: boolean
            description: 'Indicates whether the custom metadata field is read only. A read only field cannot be modified after being set. This field is configurable only via the **Path policy** feature.

              '
          minValue:
            description: 'Minimum value of the field. Only set if field type is `Date` or `Number`. For `Date` type field, the value will be in ISO8601 string format. For `Number` type field, it will be a numeric value.

              '
            oneOf:
            - type: string
            - type: number
          maxValue:
            description: 'Maximum value of the field. Only set if field type is `Date` or `Number`. For `Date` type field, the value will be in ISO8601 string format. For `Number` type field, it will be a numeric value.

              '
            oneOf:
            - type: string
            - type: number
          minLength:
            description: 'Minimum length of string. Only set if `type` is set to `Text` or `Textarea`.

              '
            type: number
          maxLength:
            description: 'Maximum length of string. Only set if `type` is set to `Text` or `Textarea`.

              '
            type: number
    VideoTransformationOptions:
      type: object
      description: Configuration options for video transformations.
      properties:
        video_codec:
          type: string
          enum:
          - h264
          - vp9
          - av1
          description: Video codec used for encoding (h264, vp9, or av1).
        audio_codec:
          type: string
          enum:
          - aac
          - opus
          description: Audio codec used for encoding (aac or opus).
        auto_rotate:
          type: boolean
          description: Whether to automatically rotate the video based on metadata.
        quality:
          type: integer
          description: Quality setting for the output video.
        format:
          type: string
          enum:
          - mp4
          - webm
          - jpg
          - png
          - webp
          description: Output format for the transformed video or thumbnail.
        stream_protocol:
          type: string
          enum:
          - HLS
          - DASH
          description: Streaming protocol for adaptive bitrate streaming.
        variants:
          type: array
          description: Array of quality representations for adaptive bitrate streaming.
          items:
            type: string
            description: Representation label indicating resolution or quality (e.g., "360", "480", "720", "1080").
    FileDeleteEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a file is deleted.

          '
        properties:
          type:
            type: string
            const: file.deleted
            description: Type of the webhook event.
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          data:
            type: object
            properties:
              fileId:
                type: string
                description: The unique `fileId` of the deleted file.
            required:
            - fileId
        required:
        - type
        - created_at
        - data
    UploadPreTransformSuccessEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a pre-transformation completes successfully. The file has been processed with the requested transformation and is now available in the Media Library.

          '
        properties:
          type:
            type: string
            const: upload.pre-transform.success
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          request:
            $ref: '#/components/schemas/PreTransformWebhookRequestInfo'
          data:
            $ref: '#/components/schemas/Upload'
        required:
        - type
        - created_at
        - request
        - data
    VideoTransformationBase:
      type: object
      description: Base information about a video transformation request.
      properties:
        type:
          type: string
          enum:
          - video-transformation
          - gif-to-video
          - video-thumbnail
          description: 'Type of video transformation:

            - `video-transformation`: Standard video processing (resize, format conversion, etc.)

            - `gif-to-video`: Convert animated GIF to video format

            - `video-thumbnail`: Generate thumbnail image from video

            '
        options:
          $ref: '#/components/schemas/VideoTransformationOptions'
      required:
      - type
    Interoperability:
      description: JSON object.
      type: object
      additionalProperties: true
      properties:
        InteropIndex:
          type: string
        InteropVersion:
          type: string
    UploadPostTransformErrorEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a post-transformation fails. The original file remains available, but the requested transformation could not be generated.

          '
        properties:
          type:
            type: string
            const: upload.post-transform.error
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          request:
            $ref: '#/components/schemas/PostTransformWebhookRequestInfo'
          data:
            type: object
            properties:
              fileId:
                type: string
                description: Unique identifier of the originally uploaded file.
              url:
                type: string
                format: uri
                description: URL of the attempted post-transformation.
              name:
                type: string
                description: Name of the file.
              path:
                type: string
                description: Path of the file.
              transformation:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      reason:
                        type: string
                        description: Reason for the post-transformation failure.
                        example: encoding_failed
                    required:
                    - reason
                required:
                - error
            required:
            - fileId
            - url
            - name
            - path
            - transformation
        required:
        - type
        - created_at
        - request
        - data
    FileCreateEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a file is created.

          '
        properties:
          type:
            type: string
            const: file.created
            description: Type of the webhook event.
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          data:
            $ref: '#/components/schemas/FileDetails'
        required:
        - type
        - created_at
        - data
    FileUpdateEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a file is updated.

          '
        properties:
          type:
            type: string
            const: file.updated
            description: Type of the webhook event.
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          data:
            $ref: '#/components/schemas/FileDetails'
        required:
        - type
        - created_at
        - data
    FileVersionDeleteEvent:
      allOf:
      - $ref: '#/components/schemas/BaseWebhookEvent'
      - type: object
        description: 'Triggered when a file version is deleted.

          '
        properties:
          type:
            type: string
            const: file-version.deleted
            description: Type of the webhook event.
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the event occurred in ISO8601 format.
          data:
            type: object
            properties:
              fileId:
                type: string
                description: The unique `fileId` of the deleted file.
              versionId:
                type: string
                description: The unique `versionId` of the deleted file version.
            required:
            - fileId
            - versionId
        required:
        - type
        - created_at
        - data
    PostTransformWebhookRequestInfo:
      type: object
      properties:
        x_request_id:
          type: string
          description: Unique identifier for the originating request.
        transformation:
          type: object
          properties:
            type:
              type: string
              enum:
              - transformation
              - abs
              - gif-to-video
              - thumbnail
              description: Type of the requested post-transformation.
            value:
              type: string
              description: Value for the requested transformation type.
            protocol:
              type: string
              enum:
              - hls
              - dash
              description: Only applicable if transformation type is 'abs'. Streaming protocol used.
          required:
          - type
      required:
      - x_request_id
      - transformation
    EmbeddedMetadata:
      type: object
      additionalProperties: true
      description: Consolidated embedded metadata associated with the file. It includes exif, iptc, and xmp data.
    ExifImage:
      description: Object containing EXIF image information.
      type: object
      additionalProperties: true
      properties:
        Make:
          type: string
        Model:
          type: string
        ImageDescription:
          type: string
        Artist:
          type: string
        Copyright:
          type: string
        Orientation:
          type: integer
        XResolution:
          type: number
        YResolution:
          type: number
        ResolutionUnit:
          type: integer
        Software:
          type: string
        ModifyDate:
          type: string
        YCbCrPositioning:
          type: integer
        ExifOffset:
          type: integer
        GPSInfo:
          type: integer
    AITag:
      type: object
      properties:
        name:
          type: string
          description: Name of the tag.
        confidence:
          type: number
          description: Confidence score of the tag.
        source:
          type: string
          description: Source of the tag. Possible values are `google-auto-tagging` and `aws-auto-tagging`.
      description: 'AI-generated tag associated with an image. These tags can be added using the `google-auto-tagging` or `aws-auto-tagging` extensions.

        '
    PreTransformWebhookRequestInfo:
      type: object
      properties:
        x_request_id:
          type: string
          description: Unique identifier for the originating request.
        transformation:
          type: string
          description: The requested pre-transformation string.
      required:
      - x_request_id
      - transformation
    BaseWebhookEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the event.
        type:
          type: string
          description: The type of webhook event.
      required:
      - id
      - type
    Metadata:
      description: JSON object containing metadata.
      type: object
      additionalProperties: true
      properties:
        height:
          type: integer
          description: The height of the image or video in pixels.
        width:
          type: integer
          description: The width of the image or video in pixels.
        size:
          type: integer
          description: The file size in bytes.
        format:
          type: string
          description: The format of the file (e.g., 'jpg', 'mp4').
        hasColorProfile:
          type: boolean
          description: Indicates if the image has a color profile.
        quality:
          type: integer
          description: The quality indicator of the image.
        density:
          type: integer
          description: The density of the image in DPI.
        hasTransparency:
          type: boolean
          description: Indicates if the image contains transparent areas.
        pHash:
          type: string
          description: Perceptual hash of the image.
        bitRate:
          type: integer
          description: The bit rate of the video in kbps (only for video).
        duration:
          type: integer
          description: The duration of the video in seconds (only for video).
        audioCodec:
          type: string
          description: The audio codec used in the video (only for video).
        videoCodec:
          type: string
          description: The video codec used in the video (only for video).
        exif:
          type: object
          additionalProperties: true
          properties:
            image:
              $ref: '#/components/schemas/ExifImage'
            thumbnail:
              $ref: '#/components/schemas/Thumbnail'
            exif:
              $ref: '#/components/schemas/ExifDetails'
            gps:
              $ref: '#/components/schemas/Gps'
            interoperability:
              $ref: '#/components/schemas/Interoperability'
            makernote:
              type: object
              additionalProperties: true
    Upload:
      description: Object containing details of a successful upload.
      type: object
      properties:
        fileId:
          type: string
          description: Unique fileId. Store this fileld in your database, as this will be used to perform update action on this file.
        name:
          type: string
          description: Name of the asset.
        filePath:
          type: string
          description: The relative path of the file in the media library e.g. `/marketing-assets/new-banner.jpg`.
        url:
          type: string
          description: A publicly accessible URL of the file.
        thumbnailUrl:
          type: string
          description: In the case of an image, a small thumbnail URL.
        height:
          type: number
          description: Height of the image in pixels (Only for images)
        width:
          type: number
          description: Width of the image in pixels (Only for Images)
        size:
          type: number
          description: Size of the image file in Bytes.
        bitRate:
          type: integer
          description: The bit rate of the video in kbps (only for video).
        duration:
          type: integer
          description: The duration of the video in seconds (only for video).
        audioCodec:
          type: string
          description: The audio codec used in the video (only for video).
        videoCodec:
          type: string
          description: The video codec used in the video (only for video).
        tags:
          type:
          - array
          - null
          items:
            type: string
          description: The array of tags associated with the asset. If no tags are set, it will be `null`. Send `tags` in `responseFields` in API request to get the value of this field.
        AITags:
          type:
          - array
          - null
          items:
            $ref: '#/components/schemas/AITag'
          description: 'An array of tags assigned to the uploaded file by auto tagging.

            '
        versionInfo:
          $ref: '#/components/schemas/VersionInfo'
        isPrivateFile:
          type: boolean
          description: 'Is the file marked as private. It can be either `true` or `false`. Send `isPrivateFile` in `responseFields` in API request to get the value of this field.

            '
        isPublished:
          type: boolean
          description: 'Is the file published or in draft state. It can be either `true` or `false`. Send `isPublished` in `responseFields` in API request to get the value of this field.

            '
        customCoordinates:
          type:
          - string
          - null
          description: 'Value of custom coordinates associated with the image in the format `x,y,width,height`. If `customCoordinates` are not defined, then it is `null`. Send `customCoordinates` in `responseFields` in API request to get the value of this field.

            '
        fileType:
          type: string
          description: 'Type of the uploaded file. Possible values are `image`, `non-image`.

            '
        customMetadata:
          description: 'A key-value data associated with the asset. Use `responseField` in API request to get `customMetadata` in the upload API response. Before setting any custom metadata on an asset, you have to create the field using custom metadata fields API. Send `customMetadata` in `responseFields` in API request to get the value of this field.

            '
          $ref: '#/components/schemas/CustomMetadata'
        selectedFieldsSchema:
          $ref: '#/components/schemas/SelectedFieldsSchema'
        extensionStatus:
          type: object
          description: 'Extension names with their processing status at the time of completion of the request. It could have one of the following status values:


            `success`: The extension has been successfully applied.

            `failed`: The extension has failed and will not be retried.

            `pending`: The extension will finish processing in some time. On completion, the final status (success / failed) will be sent to the `webhookUrl` provided.


            If no extension was requested, then this parameter is not returned.

            '
          properties:
            google-auto-tagging:
              type: string
              enum:
              - success
              - pending
              - failed
            aws-auto-tagging:
              type: string
              enum:
              - success
              - pending
              - failed
            remove-bg:
              type: string
              enum:
              - success
              - pending
              - failed
            ai-auto-description:
              type: string
              enum:
              - success
              - pending
              - failed
            ai-tasks:
              type: string
              enum:
              - success
              - pending
              - failed
        metadata:
          type: object
          $ref: '#/components/schemas/Metadata'
          description: 'Legacy metadata. Send `metadata` in `responseFields` in API request to get metadata in the upload API response.

            '
        embeddedMetadata:
          description: Consolidated embedded metadata associated with the file. It includes exif, iptc, and xmp data. Send `embeddedMetadata` in `responseFields` in API request to get embeddedMetadata in the upload API response.
          $ref: '#/components/schemas/EmbeddedMetadata'
        description:
          type: string
          description: 'Optional text to describe the contents of the file. Can be set by the user or the ai-auto-description extension.

            '
    VideoWebhookRequestInfo:
      type: object
      description: Information about the original request that triggered the video transformation.
      properties:
        x_request_id:
          type: string
          description: Unique identifier for the originating transformation request.
        url:
          type: string
          format: uri
          description: Full URL of the transformation request that was submitted.
        user_agent:
          type: string
          description: User-Agent header from the original request that triggered the transformation.
      required:
      - x_request_id
      - url
  securitySchemes:
    basicAuth:
      description: 'Basic HTTP authentication. Allowed headers-- Authorization: Basic <private_api_key> | Authorization: Basic <base64 hash of `private_api_key:`>

        ImageKit API uses API keys to authenticate requests. You can view and manage your API keys in [the dashboard](https://imagekit.io/dashboard/developer/api-keys).

        All API requests must be made over HTTPS. Calls made over plain HTTP will fail. API requests without authentication will also fail.'
      scheme: basic
      type: http
