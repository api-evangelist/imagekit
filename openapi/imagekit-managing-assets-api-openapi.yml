        content:
          application/json:
            schema:
              type: object
              required:
              - fileIds
              - tags
              properties:
                fileIds:
                  type: array
                  items:
                    type: string
                  description: 'An array of fileIds to which you want to add tags.

                    '
                tags:
                  type: array
                  items:
                    type: string
                  description: 'An array of tags that you want to add to the files.

                    '
            example:
              fileIds:
              - 598821f949c0a938d57563bd
              - 598821f949c0a938d57563be
              tags:
              - t-shirt
              - round-neck
              - sale2019
