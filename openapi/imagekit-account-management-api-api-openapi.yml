          required:
          - byRequests
          - byBandwidth
        urlEndpoints:
          type: object
          description: CDN traffic grouped by configured URL endpoint. Traffic that does not match any named URL endpoint pattern is grouped under `Default`.
          properties:
            byRequests:
              description: Top URL endpoints sorted by request count.
