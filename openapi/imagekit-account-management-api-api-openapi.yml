                  properties:
                    name:
                      type: string
                      description: URL of the image asset.
                  required:
                  - name
            byBandwidth:
              description: Top image assets sorted by bandwidth utilized.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: URL of the image asset.
                  required:
                  - name
          required:
          - byRequests
          - byBandwidth
        topVideos:
