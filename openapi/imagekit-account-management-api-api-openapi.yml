    UsageAnalyticsResponse:
      type: object
      properties:
        startDate:
          description: Start date of the computed analytics data.
          type: string
          format: date
        endDate:
          description: End date of the computed analytics data.
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
          description: 'Date and time when the analytics data was computed. Use this to gauge how fresh the returned data is. The date and time is in ISO8601 format.

            '
        requestCount:
          type: number
          description: Total number of requests made during the specified date range.
        bandwidthBytes:
          type: number
          description: Total bandwidth, in bytes, utilized during the specified date range.
        statusCodes:
          type: array
          description: Request count grouped by HTTP status code.
          items:
            type: object
            properties:
              name:
                type: string
                description: HTTP status code.
                example: '200'
              requestCount:
                type: number
                description: Number of requests that received this status code.
            required:
            - name
            - requestCount
        errorReasons:
          type: array
          description: Request count grouped by origin error reason. This covers failed origin fetches, such as an asset not found at origin or an origin timeout. It is not the HTTP status code returned to the client, see `statusCodes` for that.
          items:
            type: object
            properties:
              name:
                type: string
                description: Description of the error reason.
                example: ENOENT - Resource not found at any upstream origin
              requestCount:
                type: number
                description: Number of requests that failed with this error reason.
            required:
            - name
            - requestCount
        top404Assets:
          type: array
          description: Top URLs that returned a 404 response.
          items:
            type: object
            properties:
              name:
                type: string
                description: URL that returned a 404 response.
                example: https://ik.imagekit.io/demo/products/discontinued-sku-4421.jpg
              requestCount:
                type: number
                description: Number of requests to this URL that returned a 404 response.
            required:
            - name
            - requestCount
        extensions:
          type: array
          description: Raw per-extension operation counts for the date range. These are raw operation counts, not billable extension units. For billable usage, use the `/v1/accounts/usage` endpoint.
          items:
            type: object
            properties:
              name:
                type: string
                description: Extension identifier.
                example: remove-bg
              operationCount:
                type: number
                description: Number of times this extension ran during the date range.
            required:
            - name
            - operationCount
        cache:
          type: object
          description: CDN cache hit, miss and error counts for the date range.
          properties:
            hitCount:
              type: number
              description: Number of requests served from cache, including full hits and revalidated hits.
            missCount:
              type: number
              description: Number of requests that were not found in cache and had to be fetched from origin.
            errorCount:
              type: number
              description: Number of requests where the CDN encountered a cache error or exceeded capacity while serving the response.
          required:
          - hitCount
          - missCount
          - errorCount
        videoProcessing:
          type: array
          description: Raw observed video transcode output duration, in seconds, grouped by resolution and codec. These are raw seconds, not billable Video Processing Units (VPU). For billable VPU totals, use the `/v1/accounts/usage` endpoint.
          items:
            type: object
            properties:
              resolution:
                type: string
                description: Output resolution tier (e.g. `SD`, `HD`, `4K`).
              codec:
                type: string
                description: Video codec used for the output (e.g. `h264`, `av1`).
              durationSeconds:
                type: number
                description: Total output duration, in seconds, for this resolution and codec combination.
            required:
            - resolution
            - codec
            - durationSeconds
        country:
          type: object
          description: CDN traffic grouped by country.
          properties:
            byRequests:
              description: Top requesting countries sorted by request count.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: Country name.
                    code:
                      type: string
                      description: ISO country code.
                  required:
                  - name
                  - code
            byBandwidth:
              description: Top requesting countries sorted by total bandwidth utilized.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: Country name.
                    code:
                      type: string
                      description: ISO country code.
                  required:
                  - name
                  - code
          required:
          - byRequests
          - byBandwidth
        format:
          type: object
          description: CDN traffic grouped by response `Content-Type`.
          properties:
            byRequests:
              description: Top content types sorted by request count.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: MIME type (e.g. `image/webp`).
                  required:
                  - name
            byBandwidth:
              description: Top content types sorted by bandwidth utilized.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: MIME type (e.g. `image/webp`).
                  required:
                  - name
          required:
          - byRequests
          - byBandwidth
        device:
          type: object
          description: CDN traffic grouped by device and operating system (e.g. `Desktop - Apple Mac`, `Smartphone - Apple iPhone`).
          properties:
            byRequests:
              description: Top device/OS combinations sorted by request count.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: Device category combined with operating system or vendor (e.g. `Desktop - Windows PC`).
                  required:
