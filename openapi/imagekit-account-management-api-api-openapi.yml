  /v1/accounts/usage-analytics:
    get:
      operationId: get-usage-analytics
      summary: Get usage analytics
      description: '**Note:** This API is currently in beta.


        Get the account analytics data between two dates. The response covers the period from the start date to the end date, both dates inclusive. Both dates are interpreted as UTC calendar days.


        The returned data is scoped to the requesting account only. Unlike `/v1/accounts/usage`, an agency account''s analytics are not aggregated across its child accounts.


        The response is cached for 5 minutes per account and date range. Use `generatedAt` to check how fresh the returned data is.'
      tags:
      - Account Management API
      parameters:
      - in: query
        name: startDate
        required: true
        description: 'Specify a `startDate` in `YYYY-MM-DD` format, interpreted as a UTC calendar day. It should be before the `endDate`. The difference between `startDate` and `endDate` should be less than 90 days.

          '
        schema:
          type: string
          format: date
        example: '2026-06-28'
      - in: query
        name: endDate
        required: true
        description: 'Specify an `endDate` in `YYYY-MM-DD` format, interpreted as a UTC calendar day. It should be after the `startDate`. The difference between `startDate` and `endDate` should be less than 90 days.

          '
        schema:
          type: string
          format: date
        example: '2026-06-30'
      responses:
        '200':
          description: Usage analytics for the requested date range.
          content:
            application/json:
              schema:
