            byBandwidth:
              description: Top device/OS combinations sorted by bandwidth utilized.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: Device category combined with operating system or vendor (e.g. `Desktop - Windows PC`).
                  required:
                  - name
          required:
          - byRequests
          - byBandwidth
        browser:
          type: object
          description: CDN traffic grouped by browser.
          properties:
            byRequests:
              description: Top browsers sorted by request count.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: Browser name (e.g. `Chrome`).
                  required:
                  - name
            byBandwidth:
              description: Top browsers sorted by bandwidth utilized.
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/RequestBandwidthEntry'
                - type: object
                  properties:
                    name:
                      type: string
                      description: Browser name (e.g. `Chrome`).
                  required:
