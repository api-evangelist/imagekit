  /v1/bulkJobs/renameFolder:
    post:
      tags:
      - Digital Asset Management (DAM)
      operationId: rename-folder
      summary: Rename folder
      description: 'This API allows you to rename an existing folder. The folder and all its nested assets and sub-folders will remain unchanged, but their paths will be updated to reflect the new folder name.

        '
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - folderPath
              - newFolderName
              properties:
                folderPath:
                  type: string
                  description: 'The full path to the folder you want to rename.

                    '
                  example: /path/of/folder
                newFolderName:
                  type: string
                  description: 'The new name for the folder.


                    All characters except alphabets and numbers (inclusive of unicode letters, marks, and numerals in other languages) and `-` will be replaced by an underscore i.e. `_`.

                    '
                  example: new-folder-name
                purgeCache:
                  type: boolean
                  description: 'Option to purge cache for the old nested files and their versions'' URLs.


                    When set to true, it will internally issue a purge cache request on CDN to remove the cached content of the old nested files and their versions. There will only be one purge request for all the nested files, which will be counted against your monthly purge quota.


                    Note: A purge cache request will be issued against `https://ik.imagekit.io/old/folder/path*` (with a wildcard at the end). This will remove all nested files, their versions'' URLs, and any transformations made using query parameters on these files or their versions. However, the cache for file transformations made using path parameters will persist. You can purge them using the purge API. For more details, refer to the purge API documentation.


                    Default value - `false`

                    '
                  example: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                    - folderPath cannot be root.
                    - folderPath parameter is missing.
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Folder not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Source folder not found.
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
        '409':
          description: If a folder with newFileName already exist in the same location.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Folder with name newFolderName already exists at the same location.
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
        '423':
          description: Locked resource - A bulk operation is currently running on the folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                    - A bulk job is running on given folder path, please try after sometime.
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/bulkJobs/{jobId}:
    get:
      tags:
      - Digital Asset Management (DAM)
      operationId: bulk-job-status
      summary: Bulk job status
      description: 'This API returns the status of a bulk job like copy and move folder operations.

        '
      parameters:
      - description: 'The `jobId` is returned in the response of bulk job API e.g. copy folder or move folder API.

          '
        in: path
        name: jobId
        required: true
        schema:
          type: string
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 'On success, you will receive the status of the bulk job in the response body.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    description: 'Unique identifier of the bulk job.

                      '
                  type:
                    type: string
                    description: 'Type of the bulk job.

                      '
                    enum:
                    - COPY_FOLDER
                    - MOVE_FOLDER
                    - RENAME_FOLDER
                  status:
                    type: string
                    description: 'Status of the bulk job.

                      '
                    enum:
                    - Pending
                    - Completed
                  purgeRequestId:
                    type: string
                    description: 'Unique identifier of the purge request. This will be present only if `purgeCache` is set to `true` in the rename folder API request.

                      '
                example:
                  jobId: 5d5b1a9b4c8c4c0001f3e4a2
                  type: COPY_FOLDER
                  status: Completed
        '207':
          description: 'Partial success – the folder was renamed, but purge cache failed for nested files. It is only returned when `purgeCache` is set `true` in the rename folder API request.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    description: 'Unique identifier of the bulk job.

                      '
                  type:
                    type: string
                    description: 'Type of the bulk job. It is only possible for `RENAME_FOLDER`.

                      '
                  status:
                    type: string
                    description: 'Status of the bulk job. It will be `Partial success`.

                      '
                  message:
                    type: string
                    example: Folder renamed successfully but purging cache on nested files failed.
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
                example:
                  jobId: 5d5b1a9b4c8c4c0001f3e4a2
                  type: RENAME_FOLDER
                  status: Partial success
                  message: Folder renamed successfully but purging cache on nested files failed.
                  help: For support kindly contact us at support@imagekit.io.
        '404':
