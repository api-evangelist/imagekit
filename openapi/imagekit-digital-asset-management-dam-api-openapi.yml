  /v1/bulkJobs/copyFolder:
    post:
      tags:
      - Digital Asset Management (DAM)
      operationId: copy-folder
      summary: Copy folder
      description: 'This will copy one folder into another. The selected folder, its nested folders, files, and their versions (in `includeVersions` is set to true) are copied in this operation. Note: If any file at the destination has the same name as the source file, then the source file and its versions will be appended to the destination file version history.

        '
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sourceFolderPath
              - destinationPath
              properties:
                sourceFolderPath:
                  type: string
                  description: 'The full path to the source folder you want to copy.

                    '
                  example: /path/of/source/folder
                destinationPath:
                  type: string
                  description: 'Full path to the destination folder where you want to copy the source folder into.

                    '
                  example: /path/of/destination/folder
                includeVersions:
                  type: boolean
                  description: 'Option to copy all versions of files that are nested inside the selected folder. By default, only the current version of each file will be copied. When set to true, all versions of each file will be copied. Default value - `false`.

                    '
                  example: true
      responses:
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '404':
          description: Folder not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                    example: NO_FILES_FOLDER
                  message:
                    type: string
                    example: No files & folder found at sourceFolderPath `/folder/to/copy`.
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: sourceFolderPath and destinationPath is same
                  reason:
                    type: string
                    examples:
                    - MISSING_PARAMETER
                    - INVALID_PARAMETER
                    - TOO_MANY_OBJECTS
                    - SOURCE_IS_ROOT
                    - SAME_SOURCE_AND_DESTINATION
                    - INVALID_FOLDER_PATH
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
        '423':
          description: Locked resource - A bulk operation is currently running on the folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                    - A bulk job is running on given folder path, please try after sometime.
                    - Destination folder path is already locked. Please try after sometime.
                  help:
                    type: string
                    example: For support kindly contact us at support@imagekit.io.
